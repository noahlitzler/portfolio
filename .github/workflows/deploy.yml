name: Déploiement portfolio VPS

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: portfolio-production
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.DEPLOIEMENT_ACTIF == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      # Action et principe SSH étudiés dans le cours de Hakim.
      - name: Mettre à jour le portfolio sur le VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          fingerprint: ${{ secrets.VPS_FINGERPRINT }}
          script: |
            set -eu
            cd /var/www/portfolio
            test "$(git remote get-url origin)" = "https://github.com/noahlitzler/portfolio.git"
            test "$(git branch --show-current)" = "main"
            test -z "$(git status --porcelain --untracked-files=no)"
            test -f .env
            if test -d dist; then
              mkdir -p /home/etudiant/portfolio-backups
              cp -a dist "/home/etudiant/portfolio-backups/dist-$(date -u +%Y%m%dT%H%M%S)"
            fi
            git pull --ff-only origin main
            /home/etudiant/.bun/bin/bun install --frozen-lockfile
            /home/etudiant/.bun/bin/bun run test
            /home/etudiant/.bun/bin/bun run --bun build
            test -f dist/server/entry.mjs
            sudo -n /usr/bin/systemctl restart portfolio.service
            sleep 2
            /usr/bin/systemctl is-active --quiet portfolio.service
            curl --fail --silent --show-error --max-time 10 http://127.0.0.1:3355/ >/dev/null
