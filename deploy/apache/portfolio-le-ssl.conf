<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName noahlitzler.fr
    ServerAlias www.noahlitzler.fr

    RewriteEngine On
    RewriteCond %{HTTP_HOST} =www.noahlitzler.fr [NC]
    RewriteRule ^ https://noahlitzler.fr%{REQUEST_URI} [R=301,L,NE]

    ProxyRequests Off
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Host "expr=%{HTTP_HOST}"
    RequestHeader unset X-Forwarded-Port
    RequestHeader unset X-Forwarded-For
    RequestHeader set X-Forwarded-Proto "expr=%{REQUEST_SCHEME}"
    RequestHeader set X-Portfolio-Client-IP "expr=%{REMOTE_ADDR}"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    LimitRequestBody 16384
    ProxyTimeout 30
    ProxyPass / http://127.0.0.1:3355/
    ProxyPassReverse / http://127.0.0.1:3355/

    ErrorLog ${APACHE_LOG_DIR}/portfolio-error.log
    CustomLog ${APACHE_LOG_DIR}/portfolio-access.log combined

    SSLCertificateFile /etc/letsencrypt/live/noahlitzler.fr/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/noahlitzler.fr/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
